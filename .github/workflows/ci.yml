name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  stylua:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ^2.1.0
          args: --check .
